#@TYPE: Machine
#@NAME: AM69 SK
#@DESCRIPTION: Machine configuration for the TI AM69 SK

require conf/machine/include/am69.inc

TFA_K3_USART = "0x8"
OPTEE_K3_USART = "0x8"

KERNEL_DEVICETREE_PREFIX = " \
    ti/k3-am69-sk \
    ti/k3-fpdlink \
    ti/k3-v3link \
    ti/k3-am68-sk-v3link-fusion \
    ti/k3-j721e-sk-csi2-dual-imx219 \
    ti/k3-j721e-sk-fpdlink-fusion \
"

KERNEL_DEVICETREE = " \
    ti/k3-am69-sk.dtb \
    ti/k3-j721e-sk-csi2-dual-imx219.dtbo \
"

UBOOT_MACHINE = "am69_sk_a72_defconfig"
UBOOT_MACHINE:tie-test-builds = ""

UBOOT_CONFIG = ""
UBOOT_CONFIG:tie-test-builds = "main"
UBOOT_CONFIG:prepend:tie-test-builds = "ethboot "

UBOOT_CONFIG[main] = "am69_sk_a72_defconfig"
UBOOT_CONFIG[ethboot] = "am69_sk_a72_ethboot_defconfig"

MACHINE_ESSENTIAL_EXTRA_RRECOMMENDS += "ti-eth-fw-j784s4"
